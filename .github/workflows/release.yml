name: Release

# Pushing a tag v<version> builds every variant with release signing and publishes a GitHub Release
# laid out as contracts/releases.md says: manifest.json plus one epager-<board_id>-<version>.bin per
# board (what the app downloads for OTA). A tag with a pre-release part (v0.2.0-rc.1) is a pre-release.
# Each variant's version.txt must equal the tag (tools/release/make_release.py checks it).
#
# Needs the repository secret EPAGER_SIGNING_KEY: the RSA-3072 PEM from
# `espsecure.py generate_signing_key --version 2` (docs/recovery.md §4). The flashing page
# (pages.yml) also runs for the tag.
#
# Run by hand (Actions -> Release -> Run workflow) it is a dry run: it builds and assembles the
# release files, uploads them as the workflow artifact `release` and publishes nothing. Without the
# secret the dry run builds unsigned images; a tag push fails.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [paper, lcd]
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v6
      - name: Allow git in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Signing key
        id: key
        env:
          EPAGER_SIGNING_KEY: ${{ secrets.EPAGER_SIGNING_KEY }}
        run: |
          if [ -n "$EPAGER_SIGNING_KEY" ]; then
            mkdir -p keys
            printf '%s\n' "$EPAGER_SIGNING_KEY" > keys/dev_signing_key.pem
            chmod 600 keys/dev_signing_key.pem
            echo "sign=ON" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::EPAGER_SIGNING_KEY is not set: a release needs signed images"
            exit 1
          else
            echo "::warning::EPAGER_SIGNING_KEY is not set: dry run with unsigned images"
            echo "sign=OFF" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C variants/${{ matrix.variant }} -B build/${{ matrix.variant }} \
            -DEPAGER_SIGN=${{ steps.key.outputs.sign }} build
      - name: Remove the key
        if: always()
        run: rm -rf keys
      # The common parent of these paths is build/<variant>, which becomes the artifact's root.
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            build/${{ matrix.variant }}/epager_${{ matrix.variant }}.bin
            build/${{ matrix.variant }}/epager_${{ matrix.variant }}.elf
            build/${{ matrix.variant }}/project_description.json
            build/${{ matrix.variant }}/sdkconfig
            build/${{ matrix.variant }}/CMakeCache.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: build
      - name: Version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat variants/paper/version.txt)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Assemble the release files
        run: |
          python3 -m venv .venv
          .venv/bin/pip install jsonschema
          signed=""
          [ "$GITHUB_EVENT_NAME" = "push" ] || signed="--allow-unsigned"
          .venv/bin/python tools/release/make_release.py --version "${{ steps.ver.outputs.version }}" \
            --out release $signed \
            --notes-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v${{ steps.ver.outputs.version }}" \
            --image paper=build/build-paper --image lcd=build/build-lcd
          for v in paper lcd; do
            cp "build/build-$v/epager_$v.elf" "release/epager-$v-${{ steps.ver.outputs.version }}.elf"
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
      - uses: actions/upload-artifact@v6
        with:
          name: release
          path: release
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          tag="$GITHUB_REF_NAME"
          flags="--generate-notes --verify-tag"
          case "$tag" in *-*) flags="$flags --prerelease";; esac
          gh release create "$tag" release/* --title "ePager firmware $tag" $flags
